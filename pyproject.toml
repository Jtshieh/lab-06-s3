[project]
name = "s3-lab"
version = "0.1.0"
description = "S3 work for DS2022"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.117",
    "requests>=2.34.2",
]

[project.scripts]
s3-lab = "s3_lab.stage_books:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
